{% extends "base.html" %}
{% block titulo %}Criar conta — LembraAI{% endblock %}
{% block conteudo %}
<h1>Criar conta</h1>
<p>Leva menos de um minuto.</p>
{% if erro %}<div class="erro" role="alert">{{ erro }}</div>{% endif %}
<form method="post" action="{{ url_for('cadastrar') }}">
  <div class="campo">
    <label for="name">Nome</label>
    <input type="text" id="name" name="name" autocomplete="name">
  </div>
  <div class="campo">
    <label for="email">E-mail</label>
    <input type="email" id="email" name="email" required autocomplete="email">
  </div>
  <div class="campo">
    <label for="password">Senha (mínimo 8 caracteres)</label>
    <input type="password" id="password" name="password" required minlength="8" autocomplete="new-password">
  </div>
  <button class="btn" type="submit">Cadastrar</button>
</form>
<p>Já tem conta? <a href="{{ url_for('login') }}">Entrar</a></p>
{% endblock %}
